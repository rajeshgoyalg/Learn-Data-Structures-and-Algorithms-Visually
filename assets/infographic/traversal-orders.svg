<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Infographic showing in-order, pre-order, post-order and level-order traversals of one binary tree">
  <title>Infographic showing in-order, pre-order, post-order and level-order traversals of one binary tree</title>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.09"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
  </defs>
  <style>
  text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;dominant-baseline:middle}
  .title{fill:#e2e8f0;font-size:17px;font-weight:700;dominant-baseline:auto}
  .sub{fill:#94a3b8;font-size:12px;dominant-baseline:auto}
  .lbl{fill:#94a3b8;font-size:11px;text-anchor:middle}
  .lbl-l{fill:#94a3b8;font-size:11px}
  .val{fill:#e2e8f0;font-size:16px;text-anchor:middle;font-weight:600}
  .idx{fill:#64748b;font-size:10px;text-anchor:middle}
  .cell{fill:#0f2438;stroke:#38bdf8;stroke-width:1.5;rx:4}
  .step{fill:#fbbf24;font-size:12px;font-weight:700}
  .edge{stroke:#38bdf8;stroke-width:1.6;fill:none}

  </style>
  <rect x="0" y="0" width="900" height="600" rx="14" fill="#0b1c2c"/>
  <rect x="0" y="0" width="900" height="600" rx="14" fill="url(#g)"/>
  <rect x="0.75" y="0.75" width="898.5" height="598.5" rx="13.5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
  <text class="title" x="24" y="34">Four ways to read one tree</text>
  <text class="sub" x="24" y="54">Move a single line of code and the output order changes completely</text>
  <text class="lbl-l hdrline" x="24" y="96">one tree, four reading orders - and the order you pick is the algorithm</text>
  <g transform="translate(0,0.4)">
  <line x1="232.2" y1="194.6" x2="177.8" y2="239.4" stroke="#38bdf8" stroke-width="1.6" opacity="0.8"/>
  <line x1="267.8" y1="194.6" x2="322.2" y2="239.4" stroke="#38bdf8" stroke-width="1.6" opacity="0.8"/>
  <line x1="148.0" y1="273.7" x2="127.0" y2="308.3" stroke="#38bdf8" stroke-width="1.6" opacity="0.8"/>
  <line x1="172.0" y1="273.7" x2="193.0" y2="308.3" stroke="#38bdf8" stroke-width="1.6" opacity="0.8"/>
  <line x1="328.0" y1="273.7" x2="307.0" y2="308.3" stroke="#38bdf8" stroke-width="1.6" opacity="0.8"/>
  <line x1="352.0" y1="273.7" x2="373.0" y2="308.3" stroke="#38bdf8" stroke-width="1.6" opacity="0.8"/>
  <g><circle cx="250.0" cy="180.0" r="23" fill="#0f2438" stroke="#38bdf8" stroke-width="2.2"/><text x="250.0" y="181.0" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">50</text></g>
  <g><circle cx="160.0" cy="254.0" r="23" fill="#0f2438" stroke="#38bdf8" stroke-width="2.2"/><text x="160.0" y="255.0" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">30</text></g>
  <g><circle cx="340.0" cy="254.0" r="23" fill="#0f2438" stroke="#38bdf8" stroke-width="2.2"/><text x="340.0" y="255.0" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">70</text></g>
  <g><circle cx="115.0" cy="328.0" r="23" fill="#0f2438" stroke="#38bdf8" stroke-width="2.2"/><text x="115.0" y="329.0" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">20</text></g>
  <g><circle cx="205.0" cy="328.0" r="23" fill="#0f2438" stroke="#38bdf8" stroke-width="2.2"/><text x="205.0" y="329.0" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">40</text></g>
  <g><circle cx="295.0" cy="328.0" r="23" fill="#0f2438" stroke="#38bdf8" stroke-width="2.2"/><text x="295.0" y="329.0" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">60</text></g>
  <g><circle cx="385.0" cy="328.0" r="23" fill="#0f2438" stroke="#38bdf8" stroke-width="2.2"/><text x="385.0" y="329.0" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">80</text></g>
  <text x="500" y="175" font-size="12" font-weight="700" fill="#34d399">IN-ORDER</text>
  <text x="620" y="175" font-size="11" fill="#94a3b8">left - node - right</text>
  <text x="500" y="195" font-size="13" fill="#e2e8f0">20 30 40 50 60 70 80</text>
  <text x="500" y="213" font-size="11" fill="#94a3b8">sorted output; validating a BST</text>
  <text x="500" y="253" font-size="12" font-weight="700" fill="#fbbf24">PRE-ORDER</text>
  <text x="620" y="253" font-size="11" fill="#94a3b8">node - left - right</text>
  <text x="500" y="273" font-size="13" fill="#e2e8f0">50 30 20 40 70 60 80</text>
  <text x="500" y="291" font-size="11" fill="#94a3b8">copying or serialising a tree</text>
  <text x="500" y="331" font-size="12" font-weight="700" fill="#c084fc">POST-ORDER</text>
  <text x="620" y="331" font-size="11" fill="#94a3b8">left - right - node</text>
  <text x="500" y="351" font-size="13" fill="#e2e8f0">20 40 30 60 80 70 50</text>
  <text x="500" y="369" font-size="11" fill="#94a3b8">deleting a tree; evaluating expressions</text>
  <text x="500" y="409" font-size="12" font-weight="700" fill="#38bdf8">LEVEL-ORDER</text>
  <text x="620" y="409" font-size="11" fill="#94a3b8">row by row (a queue)</text>
  <text x="500" y="429" font-size="13" fill="#e2e8f0">50 30 70 20 40 60 80</text>
  <text x="500" y="447" font-size="11" fill="#94a3b8">BFS; printing a tree by depth</text>
  <text x="50" y="484" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">THE ONLY THING THAT CHANGES</text>
  <path d="M50 492 L850 492" stroke="#38bdf8" stroke-width="1" opacity="0.45"/>
  <text x="50" y="514" font-size="12" fill="#94a3b8">all four visit every node exactly once, so all four are O(n)</text>
  <text x="50" y="535" font-size="12" fill="#94a3b8">the first three are one recursive function with the visit line moved; the fourth needs an explicit queue</text>
  </g>

</svg>
