    <text x="397.0" y="268" font-size="10" fill="#64748b" text-anchor="middle">3</text>
    <g opacity="1"><rect x="444" y="200" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="473.0" y="226.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">7</text></g>
    <text x="473.0" y="268" font-size="10" fill="#64748b" text-anchor="middle">4</text>
    <text class="step" x="24" y="140">compare 5 and 2 - out of order, swap</text>
  </g>
  <g id="fr1" class="frm">
    <g opacity="1"><rect x="140" y="200" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="169.0" y="226.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">2</text></g>
    <text x="169.0" y="268" font-size="10" fill="#64748b" text-anchor="middle">0</text>
    <g opacity="1"><rect x="216" y="200" width="58" height="52" rx="5" fill="#0f2438" stroke="#fbbf24" stroke-width="2"/><text x="245.0" y="226.0" font-size="16" font-weight="600" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">5</text></g>
    <text x="245.0" y="268" font-size="10" fill="#64748b" text-anchor="middle">1</text>
    <g opacity="1"><rect x="292" y="200" width="58" height="52" rx="5" fill="#0f2438" stroke="#fbbf24" stroke-width="2"/><text x="321.0" y="226.0" font-size="16" font-weight="600" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">9</text></g>
    <text x="321.0" y="268" font-size="10" fill="#64748b" text-anchor="middle">2</text>
    <g opacity="1"><rect x="368" y="200" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="397.0" y="226.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">1</text></g>
    <text x="397.0" y="268" font-size="10" fill="#64748b" text-anchor="middle">3</text>
    <g opacity="1"><rect x="444" y="200" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="473.0" y="226.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">7</text></g>
    <text x="473.0" y="268" font-size="10" fill="#64748b" text-anchor="middle">4</text>
    <text class="step" x="24" y="140">compare 5 and 9 - already in order, move on</text>
  </g>
  <g id="fr2" class="frm">
    <g opacity="1"><rect x="140" y="200" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="169.0" y="226.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">2</text></g>
    <text x="169.0" y="268" font-size="10" fill="#64748b" text-anchor="middle">0</text>
    <g opacity="1"><rect x="216" y="200" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="245.0" y="226.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">5</text></g>
    <text x="245.0" y="268" font-size="10" fill="#64748b" text-anchor="middle">1</text>
    <g opacity="1"><rect x="292" y="200" width="58" height="52" rx="5" fill="#0f2438" stroke="#fbbf24" stroke-width="2"/><text x="321.0" y="226.0" font-size="16" font-weight="600" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">9</text></g>
    <text x="321.0" y="268" font-size="10" fill="#64748b" text-anchor="middle">2</text>
    <g opacity="1"><rect x="368" y="200" width="58" height="52" rx="5" fill="#0f2438" stroke="#fbbf24" stroke-width="2"/><text x="397.0" y="226.0" font-size="16" font-weight="600" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">1</text></g>
    <text x="397.0" y="268" font-size="10" fill="#64748b" text-anchor="middle">3</text>
    <g opacity="1"><rect x="444" y="200" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="473.0" y="226.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">7</text></g>
    <text x="473.0" y="268" font-size="10" fill="#64748b" text-anchor="middle">4</text>
    <text class="step" x="24" y="140">compare 9 and 1 - swap</text>
  </g>
  <g id="fr3" class="frm">
    <g opacity="1"><rect x="140" y="200" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="169.0" y="226.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">2</text></g>
    <text x="169.0" y="268" font-size="10" fill="#64748b" text-anchor="middle">0</text>
    <g opacity="1"><rect x="216" y="200" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="245.0" y="226.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">5</text></g>
    <text x="245.0" y="268" font-size="10" fill="#64748b" text-anchor="middle">1</text>
    <g opacity="1"><rect x="292" y="200" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="321.0" y="226.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">1</text></g>
    <text x="321.0" y="268" font-size="10" fill="#64748b" text-anchor="middle">2</text>
    <g opacity="1"><rect x="368" y="200" width="58" height="52" rx="5" fill="#0f2438" stroke="#fbbf24" stroke-width="2"/><text x="397.0" y="226.0" font-size="16" font-weight="600" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">9</text></g>
    <text x="397.0" y="268" font-size="10" fill="#64748b" text-anchor="middle">3</text>
    <g opacity="1"><rect x="444" y="200" width="58" height="52" rx="5" fill="#0f2438" stroke="#fbbf24" stroke-width="2"/><text x="473.0" y="226.0" font-size="16" font-weight="600" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">7</text></g>
    <text x="473.0" y="268" font-size="10" fill="#64748b" text-anchor="middle">4</text>
    <text class="step" x="24" y="140">compare 9 and 7 - swap. The largest value has bubbled to the end.</text>
  </g>
  <g id="fr4" class="frm">
    <g opacity="1"><rect x="140" y="200" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="169.0" y="226.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">2</text></g>
    <text x="169.0" y="268" font-size="10" fill="#64748b" text-anchor="middle">0</text>
    <g opacity="1"><rect x="216" y="200" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="245.0" y="226.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">5</text></g>
    <text x="245.0" y="268" font-size="10" fill="#64748b" text-anchor="middle">1</text>
    <g opacity="1"><rect x="292" y="200" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="321.0" y="226.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">1</text></g>
    <text x="321.0" y="268" font-size="10" fill="#64748b" text-anchor="middle">2</text>
    <g opacity="1"><rect x="368" y="200" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="397.0" y="226.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">7</text></g>
    <text x="397.0" y="268" font-size="10" fill="#64748b" text-anchor="middle">3</text>
    <g opacity="1"><rect x="444" y="200" width="58" height="52" rx="5" fill="#0f2438" stroke="#34d399" stroke-width="2"/><text x="473.0" y="226.0" font-size="16" font-weight="600" fill="#34d399" text-anchor="middle" dominant-baseline="middle">9</text></g>
    <text x="473.0" y="268" font-size="10" fill="#64748b" text-anchor="middle">4</text>
    <text class="step" x="24" y="140">pass 1 done: position 4 is final. Repeat on the shrinking prefix.</text>
  </g>
  <g id="fr5" class="frm">
    <g opacity="1"><rect x="140" y="200" width="58" height="52" rx="5" fill="#0f2438" stroke="#34d399" stroke-width="2"/><text x="169.0" y="226.0" font-size="16" font-weight="600" fill="#34d399" text-anchor="middle" dominant-baseline="middle">1</text></g>
    <text x="169.0" y="268" font-size="10" fill="#64748b" text-anchor="middle">0</text>
    <g opacity="1"><rect x="216" y="200" width="58" height="52" rx="5" fill="#0f2438" stroke="#34d399" stroke-width="2"/><text x="245.0" y="226.0" font-size="16" font-weight="600" fill="#34d399" text-anchor="middle" dominant-baseline="middle">2</text></g>
    <text x="245.0" y="268" font-size="10" fill="#64748b" text-anchor="middle">1</text>
    <g opacity="1"><rect x="292" y="200" width="58" height="52" rx="5" fill="#0f2438" stroke="#34d399" stroke-width="2"/><text x="321.0" y="226.0" font-size="16" font-weight="600" fill="#34d399" text-anchor="middle" dominant-baseline="middle">5</text></g>
    <text x="321.0" y="268" font-size="10" fill="#64748b" text-anchor="middle">2</text>
    <g opacity="1"><rect x="368" y="200" width="58" height="52" rx="5" fill="#0f2438" stroke="#34d399" stroke-width="2"/><text x="397.0" y="226.0" font-size="16" font-weight="600" fill="#34d399" text-anchor="middle" dominant-baseline="middle">7</text></g>
    <text x="397.0" y="268" font-size="10" fill="#64748b" text-anchor="middle">3</text>
    <g opacity="1"><rect x="444" y="200" width="58" height="52" rx="5" fill="#0f2438" stroke="#34d399" stroke-width="2"/><text x="473.0" y="226.0" font-size="16" font-weight="600" fill="#34d399" text-anchor="middle" dominant-baseline="middle">9</text></g>
    <text x="473.0" y="268" font-size="10" fill="#64748b" text-anchor="middle">4</text>
    <text class="step" x="24" y="140">after n-1 passes everything is sorted - at the cost of n^2/2 comparisons</text>
  </g>
  <text class="lbl-l" x="24" y="322" style="fill:#94a3b8"><tspan x="24" dy="0">O(n^2) time, O(1) space, stable. Easiest to understand, almost never the right choice in</tspan><tspan x="24" dy="17">practice.</tspan></text>
  </g>

</svg>
