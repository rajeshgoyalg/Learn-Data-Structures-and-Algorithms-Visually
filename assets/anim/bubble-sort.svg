  @keyframes fk0{0%{opacity:1} 17.66%{opacity:1} 17.666666666666664%{opacity:0} 100%{opacity:0}}
  #fr1{animation:fk1 11s infinite}
  @keyframes fk1{0%{opacity:0} 17.66%{opacity:0} 17.666666666666664%{opacity:1} 31.32%{opacity:1} 31.33333333333333%{opacity:0} 100%{opacity:0}}
  #fr2{animation:fk2 11s infinite}
  @keyframes fk2{0%{opacity:0} 31.32%{opacity:0} 31.333333333333332%{opacity:1} 44.99%{opacity:1} 45.0%{opacity:0} 100%{opacity:0}}
  #fr3{animation:fk3 11s infinite}
  @keyframes fk3{0%{opacity:0} 44.99%{opacity:0} 45.0%{opacity:1} 58.66%{opacity:1} 58.666666666666664%{opacity:0} 100%{opacity:0}}
