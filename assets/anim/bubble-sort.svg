  @keyframes fk4{0%{opacity:0} 58.66%{opacity:0} 58.666666666666664%{opacity:1} 72.32%{opacity:1} 72.33333333333333%{opacity:0} 100%{opacity:0}}
  #fr5{animation:fk5 11s infinite}
  @keyframes fk5{0%{opacity:0} 72.32%{opacity:0} 72.33333333333333%{opacity:1} 100%{opacity:1}}

  </style>
  <rect x="0" y="0" width="660" height="378" rx="14" fill="#0b1c2c"/>
  <rect x="0" y="0" width="660" height="378" rx="14" fill="url(#g)"/>
  <rect x="0.75" y="0.75" width="658.5" height="376.5" rx="13.5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
  <text class="title" x="24" y="34">Bubble sort</text>
  <text class="sub" x="24" y="54">Neighbours only: swap the bigger one rightwards, over and over</text>
  <text class="lbl-l hdrline" x="24" y="96"><tspan x="24" dy="0">only ever compare neighbours and swap them - the biggest value rises to the top like a bubble</tspan><tspan x="24" dy="17">each pass</tspan></text>
