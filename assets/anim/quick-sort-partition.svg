  <text class="lbl-l" x="24" y="330" style="fill:#94a3b8"><tspan x="24" dy="0">O(n log n) average and in place, but O(n^2) if the pivot is always the smallest or largest - which</tspan><tspan x="24" dy="17">is why real implementations randomise it.</tspan></text>
