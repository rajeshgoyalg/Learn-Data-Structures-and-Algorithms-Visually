    <text x="121.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">0</text>
    <g opacity="1"><rect x="168" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="197.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">30</text></g>
    <text x="197.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">1</text>
    <g opacity="1"><rect x="244" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="273.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">40</text></g>
    <text x="273.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">2</text>
    <g opacity="1"><rect x="320" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="349.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">50</text></g>
    <text x="349.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">3</text>
    <g opacity="1"><rect x="396" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="425.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">80</text></g>
    <text x="425.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">4</text>
    <g opacity="1"><rect x="472" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="501.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">90</text></g>
    <text x="501.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">5</text>
    <g opacity="1"><rect x="548" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#fbbf24" stroke-width="2"/><text x="577.0" y="236.0" font-size="16" font-weight="600" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">70</text></g>
    <text x="577.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">6</text>
    <rect x="92" y="210" width="58" height="52" rx="5" fill="none" stroke="#c084fc" stroke-width="2.4"/>
    <rect x="168" y="210" width="58" height="52" rx="5" fill="none" stroke="#c084fc" stroke-width="2.4"/>
    <rect x="244" y="210" width="58" height="52" rx="5" fill="none" stroke="#c084fc" stroke-width="2.4"/>
    <rect x="320" y="210" width="58" height="52" rx="5" fill="none" stroke="#c084fc" stroke-width="2.4"/>
    <text class="step" x="24" y="150">swap each smaller value toward the front as you meet it</text>
  </g>
  <g id="fr3" class="frm">
    <g opacity="1"><rect x="92" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="121.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">10</text></g>
    <text x="121.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">0</text>
    <g opacity="1"><rect x="168" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="197.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">30</text></g>
    <text x="197.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">1</text>
    <g opacity="1"><rect x="244" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="273.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">40</text></g>
    <text x="273.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">2</text>
    <g opacity="1"><rect x="320" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="349.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">50</text></g>
    <text x="349.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">3</text>
    <g opacity="1"><rect x="396" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#34d399" stroke-width="2"/><text x="425.0" y="236.0" font-size="16" font-weight="600" fill="#34d399" text-anchor="middle" dominant-baseline="middle">70</text></g>
    <text x="425.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">4</text>
    <g opacity="1"><rect x="472" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="501.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">90</text></g>
    <text x="501.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">5</text>
    <g opacity="1"><rect x="548" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="577.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">80</text></g>
    <text x="577.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">6</text>
    <text class="step" x="24" y="150">swap the pivot into the boundary. 70 is now in its final position, forever.</text>
  </g>
  <g id="fr4" class="frm">
    <g opacity="1"><rect x="92" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="121.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">10</text></g>
    <text x="121.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">0</text>
    <g opacity="1"><rect x="168" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="197.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">30</text></g>
    <text x="197.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">1</text>
    <g opacity="1"><rect x="244" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="273.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">40</text></g>
    <text x="273.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">2</text>
