  <rect x="0" y="0" width="700" height="411" rx="14" fill="#0b1c2c"/>
  <rect x="0" y="0" width="700" height="411" rx="14" fill="url(#g)"/>
  <rect x="0.75" y="0.75" width="698.5" height="409.5" rx="13.5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
  <text class="title" x="24" y="34">Quicksort - partition</text>
  <text class="sub" x="24" y="54">One pivot, two piles: everything smaller left, everything larger right</text>
  <text class="lbl-l hdrline" x="24" y="96">partition around a pivot: smaller on the left, larger on the right. The pivot never moves again.</text>
