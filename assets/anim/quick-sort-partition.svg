<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 401" width="700" height="401" role="img" aria-label="Animation: quicksort partitioning an array around a pivot and locking the pivot into place">
  <title>Animation: quicksort partitioning an array around a pivot and locking the pivot into place</title>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.09"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
  </defs>
  <style>
  text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;dominant-baseline:middle}
  .title{fill:#e2e8f0;font-size:17px;font-weight:700;dominant-baseline:auto}
  .sub{fill:#94a3b8;font-size:12px;dominant-baseline:auto}
  .lbl{fill:#94a3b8;font-size:11px;text-anchor:middle}
  .lbl-l{fill:#94a3b8;font-size:11px}
  .val{fill:#e2e8f0;font-size:16px;text-anchor:middle;font-weight:600}
  .idx{fill:#64748b;font-size:10px;text-anchor:middle}
  .cell{fill:#0f2438;stroke:#38bdf8;stroke-width:1.5;rx:4}
  .step{fill:#fbbf24;font-size:12px;font-weight:700}
  .edge{stroke:#38bdf8;stroke-width:1.6;fill:none}
  .frm{opacity:0}
  #fr0{animation:fk0 11s infinite}
  @keyframes fk0{0%{opacity:1} 20.39%{opacity:1} 20.4%{opacity:0} 100%{opacity:0}}
  #fr1{animation:fk1 11s infinite}
  @keyframes fk1{0%{opacity:0} 20.39%{opacity:0} 20.4%{opacity:1} 36.79%{opacity:1} 36.8%{opacity:0} 100%{opacity:0}}
  #fr2{animation:fk2 11s infinite}
  @keyframes fk2{0%{opacity:0} 36.79%{opacity:0} 36.8%{opacity:1} 53.19%{opacity:1} 53.199999999999996%{opacity:0} 100%{opacity:0}}
  #fr3{animation:fk3 11s infinite}
  @keyframes fk3{0%{opacity:0} 53.19%{opacity:0} 53.199999999999996%{opacity:1} 69.59%{opacity:1} 69.6%{opacity:0} 100%{opacity:0}}
  #fr4{animation:fk4 11s infinite}
  @keyframes fk4{0%{opacity:0} 69.59%{opacity:0} 69.6%{opacity:1} 100%{opacity:1}}

  </style>
  <rect x="0" y="0" width="700" height="401" rx="14" fill="#0b1c2c"/>
  <rect x="0" y="0" width="700" height="401" rx="14" fill="url(#g)"/>
  <rect x="0.75" y="0.75" width="698.5" height="399.5" rx="13.5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
  <text class="title" x="24" y="34">Quicksort - partition</text>
  <text class="sub" x="24" y="54">One pivot, two piles: everything smaller left, everything larger right</text>
  <text class="lbl-l hdrline" x="24" y="96">partition around a pivot: smaller on the left, larger on the right. The pivot never moves again.</text>
  <g transform="translate(0,0.4)">
  <g id="fr0" class="frm">
    <g opacity="1"><rect x="110" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="139.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">38</text></g>
    <text x="139.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">0</text>
    <g opacity="1"><rect x="186" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="215.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">27</text></g>
    <text x="215.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">1</text>
    <g opacity="1"><rect x="262" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="291.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">43</text></g>
    <text x="291.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">2</text>
    <g opacity="1"><rect x="338" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="367.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">9</text></g>
    <text x="367.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">3</text>
    <g opacity="1"><rect x="414" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="443.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">82</text></g>
    <text x="443.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">4</text>
    <g opacity="1"><rect x="490" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#fbbf24" stroke-width="2"/><text x="519.0" y="236.0" font-size="16" font-weight="600" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">10</text></g>
    <text x="519.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">5</text>
    <text class="step" x="24" y="150">choose the last element, 10, as the pivot</text>
  </g>
  <g id="fr1" class="frm">
    <g opacity="1"><rect x="110" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="139.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">38</text></g>
    <text x="139.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">0</text>
    <g opacity="1"><rect x="186" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#fb7185" stroke-width="2"/><text x="215.0" y="236.0" font-size="16" font-weight="600" fill="#fb7185" text-anchor="middle" dominant-baseline="middle">27</text></g>
    <text x="215.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">1</text>
    <g opacity="1"><rect x="262" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="291.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">43</text></g>
    <text x="291.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">2</text>
    <g opacity="1"><rect x="338" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#fb7185" stroke-width="2"/><text x="367.0" y="236.0" font-size="16" font-weight="600" fill="#fb7185" text-anchor="middle" dominant-baseline="middle">9</text></g>
    <text x="367.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">3</text>
    <g opacity="1"><rect x="414" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="443.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">82</text></g>
    <text x="443.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">4</text>
    <g opacity="1"><rect x="490" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#fbbf24" stroke-width="2"/><text x="519.0" y="236.0" font-size="16" font-weight="600" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">10</text></g>
    <text x="519.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">5</text>
    <text class="step" x="24" y="150">walk left to right: 27 and 9 are smaller than the pivot, so they belong on its left</text>
  </g>
  <g id="fr2" class="frm">
    <g opacity="1"><rect x="110" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#fb7185" stroke-width="2"/><text x="139.0" y="236.0" font-size="16" font-weight="600" fill="#fb7185" text-anchor="middle" dominant-baseline="middle">9</text></g>
    <text x="139.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">0</text>
    <g opacity="1"><rect x="186" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#fb7185" stroke-width="2"/><text x="215.0" y="236.0" font-size="16" font-weight="600" fill="#fb7185" text-anchor="middle" dominant-baseline="middle">27</text></g>
    <text x="215.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">1</text>
    <g opacity="1"><rect x="262" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="291.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">38</text></g>
    <text x="291.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">2</text>
    <g opacity="1"><rect x="338" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="367.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">43</text></g>
    <text x="367.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">3</text>
    <g opacity="1"><rect x="414" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="443.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">82</text></g>
    <text x="443.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">4</text>
    <g opacity="1"><rect x="490" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#fbbf24" stroke-width="2"/><text x="519.0" y="236.0" font-size="16" font-weight="600" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">10</text></g>
    <text x="519.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">5</text>
    <text class="step" x="24" y="150">swap the small ones to the front as you find them</text>
  </g>
  <g id="fr3" class="frm">
    <g opacity="1"><rect x="110" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="139.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">9</text></g>
    <text x="139.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">0</text>
    <g opacity="1"><rect x="186" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#34d399" stroke-width="2"/><text x="215.0" y="236.0" font-size="16" font-weight="600" fill="#34d399" text-anchor="middle" dominant-baseline="middle">10</text></g>
    <text x="215.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">1</text>
    <g opacity="1"><rect x="262" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="291.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">38</text></g>
    <text x="291.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">2</text>
    <g opacity="1"><rect x="338" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="367.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">43</text></g>
    <text x="367.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">3</text>
    <g opacity="1"><rect x="414" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="443.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">82</text></g>
    <text x="443.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">4</text>
    <g opacity="1"><rect x="490" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="519.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">27</text></g>
    <text x="519.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">5</text>
    <text class="step" x="24" y="150">drop the pivot into the boundary. 10 is now in its final position, forever.</text>
  </g>
  <g id="fr4" class="frm">
    <g opacity="1"><rect x="110" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="139.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">9</text></g>
    <text x="139.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">0</text>
    <g opacity="1"><rect x="186" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#34d399" stroke-width="2"/><text x="215.0" y="236.0" font-size="16" font-weight="600" fill="#34d399" text-anchor="middle" dominant-baseline="middle">10</text></g>
    <text x="215.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">1</text>
    <g opacity="1"><rect x="262" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="291.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">38</text></g>
    <text x="291.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">2</text>
    <g opacity="1"><rect x="338" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="367.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">43</text></g>
    <text x="367.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">3</text>
    <g opacity="1"><rect x="414" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="443.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">82</text></g>
    <text x="443.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">4</text>
    <g opacity="1"><rect x="490" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="519.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">27</text></g>
    <text x="519.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">5</text>
    <text class="step" x="24" y="150">recurse on the left part and the right part - each is a smaller independent problem</text>
  </g>
  <text class="lbl-l" x="24" y="330" style="fill:#94a3b8"><tspan x="24" dy="0">O(n log n) average and in place, but O(n^2) if the pivot is always the smallest or largest - which</tspan><tspan x="24" dy="17">is why real implementations randomise it.</tspan></text>
  <rect x="24" y="356" width="11" height="11" rx="2" fill="#fbbf24"/>
  <text class="lbl-l" x="41" y="379">pivot</text>
  <rect x="82.0" y="356" width="11" height="11" rx="2" fill="#fb7185"/>
  <text class="lbl-l" x="99.0" y="379">smaller than pivot</text>
  <rect x="223.2" y="356" width="11" height="11" rx="2" fill="#34d399"/>
  <text class="lbl-l" x="240.2" y="379">final position</text>
  </g>

</svg>
