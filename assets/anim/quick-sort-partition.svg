<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 411" width="700" height="411" role="img" aria-label="Animation: quicksort partitioning an array around a pivot and locking the pivot into place">
  <title>Animation: quicksort partitioning an array around a pivot and locking the pivot into place</title>
