    <text x="349.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">3</text>
    <g opacity="1"><rect x="396" y="210" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="425.0" y="236.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">40</text></g>
    <text x="425.0" y="278" font-size="10" fill="#64748b" text-anchor="middle">4</text>
