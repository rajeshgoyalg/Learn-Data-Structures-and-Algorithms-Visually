    <rect x="396" y="210" width="58" height="52" rx="5" fill="none" stroke="#c084fc" stroke-width="2.4"/>
    <rect x="472" y="210" width="58" height="52" rx="5" fill="none" stroke="#c084fc" stroke-width="2.4"/>
    <text class="step" x="24" y="150">walk left to right: 10, 30, 40 and 50 are all smaller than 70, so they belong on its left</text>
  </g>
