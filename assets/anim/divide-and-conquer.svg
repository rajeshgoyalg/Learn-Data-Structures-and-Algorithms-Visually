<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 466" width="720" height="466" role="img" aria-label="Animation: the divide, conquer and combine phases of a divide and conquer algorithm">
  <title>Animation: the divide, conquer and combine phases of a divide and conquer algorithm</title>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.09"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
  </defs>
  <style>
  text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;dominant-baseline:middle}
  .title{fill:#e2e8f0;font-size:17px;font-weight:700;dominant-baseline:auto}
  .sub{fill:#94a3b8;font-size:12px;dominant-baseline:auto}
  .lbl{fill:#94a3b8;font-size:11px;text-anchor:middle}
  .lbl-l{fill:#94a3b8;font-size:11px}
  .val{fill:#e2e8f0;font-size:16px;text-anchor:middle;font-weight:600}
  .idx{fill:#64748b;font-size:10px;text-anchor:middle}
  .cell{fill:#0f2438;stroke:#38bdf8;stroke-width:1.5;rx:4}
  .step{fill:#fbbf24;font-size:12px;font-weight:700}
  .edge{stroke:#38bdf8;stroke-width:1.6;fill:none}
  .frm{opacity:0}
  #fr0{animation:fk0 10s infinite}
  @keyframes fk0{0%{opacity:1} 24.49%{opacity:1} 24.5%{opacity:0} 100%{opacity:0}}
  #fr1{animation:fk1 10s infinite}
  @keyframes fk1{0%{opacity:0} 24.49%{opacity:0} 24.5%{opacity:1} 44.99%{opacity:1} 45.0%{opacity:0} 100%{opacity:0}}
  #fr2{animation:fk2 10s infinite}
  @keyframes fk2{0%{opacity:0} 44.99%{opacity:0} 45.0%{opacity:1} 65.49%{opacity:1} 65.5%{opacity:0} 100%{opacity:0}}
  #fr3{animation:fk3 10s infinite}
  @keyframes fk3{0%{opacity:0} 65.49%{opacity:0} 65.5%{opacity:1} 100%{opacity:1}}

  </style>
  <rect x="0" y="0" width="720" height="466" rx="14" fill="#0b1c2c"/>
  <rect x="0" y="0" width="720" height="466" rx="14" fill="url(#g)"/>
  <rect x="0.75" y="0.75" width="718.5" height="464.5" rx="13.5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
  <text class="title" x="24" y="34">Divide and conquer</text>
  <text class="sub" x="24" y="54">Divide, conquer, combine - the three-line recipe behind half of all fast algorithms</text>
  <text class="lbl-l hdrline" x="24" y="96">the pattern behind merge sort, quicksort, binary search and fast matrix multiplication</text>
  <g transform="translate(0,0.4)">
  <g id="fr0" class="frm">
    <rect x="100" y="150" width="544" height="46" rx="6" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="372" y="174" font-size="12" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">problem</text>
    <rect x="100" y="236" width="264" height="46" rx="6" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="232" y="260" font-size="12" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">half</text>
    <rect x="380" y="236" width="264" height="46" rx="6" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="512" y="260" font-size="12" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">half</text>
    <line x1="372" y1="196" x2="232" y2="232" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
    <line x1="372" y1="196" x2="512" y2="232" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
    <text class="step" x="24" y="118">1. DIVIDE - break the problem into independent subproblems of the same shape</text>
  </g>
  <g id="fr1" class="frm">
    <rect x="100" y="150" width="544" height="46" rx="6" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="372" y="174" font-size="12" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">problem</text>
    <rect x="100" y="236" width="264" height="46" rx="6" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="232" y="260" font-size="12" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">half</text>
    <rect x="380" y="236" width="264" height="46" rx="6" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="512" y="260" font-size="12" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">half</text>
    <line x1="372" y1="196" x2="232" y2="232" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
    <line x1="372" y1="196" x2="512" y2="232" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
    <rect x="100" y="322" width="124" height="46" rx="6" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="162" y="346" font-size="12" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">quarter</text>
    <rect x="240" y="322" width="124" height="46" rx="6" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="302" y="346" font-size="12" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">quarter</text>
    <rect x="380" y="322" width="124" height="46" rx="6" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="442" y="346" font-size="12" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">quarter</text>
    <rect x="520" y="322" width="124" height="46" rx="6" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="582" y="346" font-size="12" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">quarter</text>
    <line x1="232" y1="282" x2="162" y2="318" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
    <line x1="232" y1="282" x2="302" y2="318" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
    <line x1="512" y1="282" x2="442" y2="318" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
    <line x1="512" y1="282" x2="582" y2="318" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
    <text class="step" x="24" y="118">keep dividing until each piece is small enough to solve outright (the base case)</text>
  </g>
  <g id="fr2" class="frm">
    <rect x="100" y="150" width="544" height="46" rx="6" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="372" y="174" font-size="12" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">problem</text>
    <rect x="100" y="236" width="264" height="46" rx="6" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="232" y="260" font-size="12" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">half</text>
    <rect x="380" y="236" width="264" height="46" rx="6" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="512" y="260" font-size="12" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">half</text>
    <line x1="372" y1="196" x2="232" y2="232" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
    <line x1="372" y1="196" x2="512" y2="232" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
    <rect x="100" y="322" width="124" height="46" rx="6" fill="#0f2438" stroke="#34d399" stroke-width="2"/><text x="162" y="346" font-size="12" fill="#34d399" text-anchor="middle" dominant-baseline="middle">quarter</text>
    <rect x="240" y="322" width="124" height="46" rx="6" fill="#0f2438" stroke="#34d399" stroke-width="2"/><text x="302" y="346" font-size="12" fill="#34d399" text-anchor="middle" dominant-baseline="middle">quarter</text>
    <rect x="380" y="322" width="124" height="46" rx="6" fill="#0f2438" stroke="#34d399" stroke-width="2"/><text x="442" y="346" font-size="12" fill="#34d399" text-anchor="middle" dominant-baseline="middle">quarter</text>
    <rect x="520" y="322" width="124" height="46" rx="6" fill="#0f2438" stroke="#34d399" stroke-width="2"/><text x="582" y="346" font-size="12" fill="#34d399" text-anchor="middle" dominant-baseline="middle">quarter</text>
    <line x1="232" y1="282" x2="162" y2="318" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
    <line x1="232" y1="282" x2="302" y2="318" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
    <line x1="512" y1="282" x2="442" y2="318" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
    <line x1="512" y1="282" x2="582" y2="318" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
    <text class="step" x="24" y="118">2. CONQUER - solve every small piece directly</text>
  </g>
  <g id="fr3" class="frm">
    <rect x="100" y="150" width="544" height="46" rx="6" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="372" y="174" font-size="12" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">problem</text>
    <rect x="100" y="236" width="264" height="46" rx="6" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="232" y="260" font-size="12" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">half</text>
    <rect x="380" y="236" width="264" height="46" rx="6" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="512" y="260" font-size="12" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">half</text>
    <line x1="372" y1="196" x2="232" y2="232" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
    <line x1="372" y1="196" x2="512" y2="232" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
    <rect x="100" y="322" width="124" height="46" rx="6" fill="#0f2438" stroke="#34d399" stroke-width="2"/><text x="162" y="346" font-size="12" fill="#34d399" text-anchor="middle" dominant-baseline="middle">quarter</text>
    <rect x="240" y="322" width="124" height="46" rx="6" fill="#0f2438" stroke="#34d399" stroke-width="2"/><text x="302" y="346" font-size="12" fill="#34d399" text-anchor="middle" dominant-baseline="middle">quarter</text>
    <rect x="380" y="322" width="124" height="46" rx="6" fill="#0f2438" stroke="#34d399" stroke-width="2"/><text x="442" y="346" font-size="12" fill="#34d399" text-anchor="middle" dominant-baseline="middle">quarter</text>
    <rect x="520" y="322" width="124" height="46" rx="6" fill="#0f2438" stroke="#34d399" stroke-width="2"/><text x="582" y="346" font-size="12" fill="#34d399" text-anchor="middle" dominant-baseline="middle">quarter</text>
    <line x1="232" y1="282" x2="162" y2="318" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
    <line x1="232" y1="282" x2="302" y2="318" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
    <line x1="512" y1="282" x2="442" y2="318" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
    <line x1="512" y1="282" x2="582" y2="318" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
    <path d="M162 316 L162 288" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arg)"/>
    <path d="M302 316 L302 288" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arg)"/>
    <path d="M442 316 L442 288" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arg)"/>
    <path d="M582 316 L582 288" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arg)"/>
    <text class="step" x="24" y="118">3. COMBINE - merge the partial answers back up into the answer for the whole</text>
  </g>
  <text class="lbl-l" x="24" y="410" style="fill:#94a3b8"><tspan x="24" dy="0">the subproblems must be independent - when they overlap instead, you want dynamic programming, not</tspan><tspan x="24" dy="17">divide and conquer</tspan></text>
  <text class="lbl-l" x="24" y="436" style="fill:#94a3b8">splitting in half and doing O(n) work per level gives the familiar O(n log n)</text>
  </g>

</svg>
