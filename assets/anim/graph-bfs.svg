    <rect x="250" y="474" width="42" height="34" rx="4" fill="#0f2438" stroke="#fbbf24" stroke-width="1.8"/><text x="271" y="491" font-size="14" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">F</text>
    <text class="step" x="24" y="118">ring 1: everything one edge from A is visited before anything two edges away</text>
  </g>
