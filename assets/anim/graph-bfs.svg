  <rect x="0.75" y="0.75" width="778.5" height="574.5" rx="13.5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
  <text class="title" x="24" y="34">Graph - breadth-first search</text>
  <text class="sub" x="24" y="54">A ripple in a pond: nearest first, level by level</text>
  <text class="lbl-l hdrline" x="24" y="96">breadth-first search uses a queue, so it finishes every node at distance k before touching distance k+1</text>
