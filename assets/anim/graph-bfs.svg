    <rect x="150" y="474" width="42" height="34" rx="4" fill="#0f2438" stroke="#fbbf24" stroke-width="1.8"/><text x="171" y="491" font-size="14" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">G</text>
