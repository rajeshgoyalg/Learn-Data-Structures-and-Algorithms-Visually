<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Animation: a queue serving from the front while new items join at the rear">
  <title>Animation: a queue serving from the front while new items join at the rear</title>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.09"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
  </defs>
  <style>
  text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;dominant-baseline:middle}
  .title{fill:#e2e8f0;font-size:17px;font-weight:700;dominant-baseline:auto}
  .sub{fill:#94a3b8;font-size:12px;dominant-baseline:auto}
  .lbl{fill:#94a3b8;font-size:11px;text-anchor:middle}
  .lbl-l{fill:#94a3b8;font-size:11px}
  .val{fill:#e2e8f0;font-size:16px;text-anchor:middle;font-weight:600}
  .idx{fill:#64748b;font-size:10px;text-anchor:middle}
  .cell{fill:#0f2438;stroke:#38bdf8;stroke-width:1.5;rx:4}
  .step{fill:#fbbf24;font-size:12px;font-weight:700}
  .edge{stroke:#38bdf8;stroke-width:1.6;fill:none}
.qi{animation:step 8s infinite}
#q0{animation:step 8s infinite;animation-delay:0.00s}
#q1{animation:step 8s infinite;animation-delay:0.05s}
#q2{animation:step 8s infinite;animation-delay:0.10s}
#q3{animation:step 8s infinite;animation-delay:0.15s}
#q4{animation:step 8s infinite;animation-delay:0.20s}
  @keyframes step{0%{transform:translateX(0);opacity:1} 18%{transform:translateX(0);opacity:1} 30%{transform:translateX(-92px);opacity:1} 50%{transform:translateX(-92px);opacity:1} 62%{transform:translateX(-184px);opacity:1} 86%{transform:translateX(-184px);opacity:1} 94%{transform:translateX(0);opacity:0} 100%{transform:translateX(0);opacity:1}}

  </style>
  <rect x="0" y="0" width="760" height="340" rx="14" fill="#0b1c2c"/>
  <rect x="0" y="0" width="760" height="340" rx="14" fill="url(#g)"/>
  <rect x="0.75" y="0.75" width="758.5" height="338.5" rx="13.5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
  <text class="title" x="24" y="34">Queue - enqueue and dequeue</text>
  <text class="sub" x="24" y="54">FIFO: print jobs, request handling, BFS frontiers</text>
  <text class="lbl-l" x="24" y="96">a checkout line: you join at the back, you are served from the front - First In, First Out</text>
  <g id="q0" class="qi"><rect class="cell" x="120" y="170" width="76" height="56"/><text class="val" x="158" y="199">A</text></g>
  <g id="q1" class="qi"><rect class="cell" x="212" y="170" width="76" height="56"/><text class="val" x="250" y="199">B</text></g>
  <g id="q2" class="qi"><rect class="cell" x="304" y="170" width="76" height="56"/><text class="val" x="342" y="199">C</text></g>
  <g id="q3" class="qi"><rect class="cell" x="396" y="170" width="76" height="56"/><text class="val" x="434" y="199">D</text></g>
  <g id="q4" class="qi"><rect class="cell" x="488" y="170" width="76" height="56"/><text class="val" x="526" y="199">E</text></g>
  <text class="lbl" x="158" y="252" style="fill:#34d399">front</text>
  <text class="lbl" x="526" y="252" style="fill:#fbbf24">rear</text>
  <path d="M50 198 L106 198" stroke="#34d399" stroke-width="2.2" fill="none" marker-end="url(#arg)"/>
  <text class="lbl-l" x="24" y="182" style="fill:#34d399">dequeue</text>
  <path d="M638 198 L578 198" stroke="#fbbf24" stroke-width="2.2" fill="none" marker-end="url(#ara)"/>
  <text class="lbl-l" x="586" y="182" style="fill:#fbbf24">enqueue</text>
  <text class="lbl-l" x="24" y="298" style="fill:#94a3b8">both ends are O(1) - nobody in the middle is ever touched</text>

</svg>
