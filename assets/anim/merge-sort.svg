<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 462" width="760" height="462" role="img" aria-label="Animation: merge sort dividing an array to single elements and merging the sorted halves back">
  <title>Animation: merge sort dividing an array to single elements and merging the sorted halves back</title>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.09"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
  </defs>
  <style>
  text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;dominant-baseline:middle}
  .title{fill:#e2e8f0;font-size:17px;font-weight:700;dominant-baseline:auto}
  .sub{fill:#94a3b8;font-size:12px;dominant-baseline:auto}
  .lbl{fill:#94a3b8;font-size:11px;text-anchor:middle}
  .lbl-l{fill:#94a3b8;font-size:11px}
  .val{fill:#e2e8f0;font-size:16px;text-anchor:middle;font-weight:600}
  .idx{fill:#64748b;font-size:10px;text-anchor:middle}
  .cell{fill:#0f2438;stroke:#38bdf8;stroke-width:1.5;rx:4}
  .step{fill:#fbbf24;font-size:12px;font-weight:700}
  .edge{stroke:#38bdf8;stroke-width:1.6;fill:none}
  .frm{opacity:0}
  #fr0{animation:fk0 11s infinite}
  @keyframes fk0{0%{opacity:1} 24.49%{opacity:1} 24.5%{opacity:0} 100%{opacity:0}}
  #fr1{animation:fk1 11s infinite}
  @keyframes fk1{0%{opacity:0} 24.49%{opacity:0} 24.5%{opacity:1} 44.99%{opacity:1} 45.0%{opacity:0} 100%{opacity:0}}
  #fr2{animation:fk2 11s infinite}
  @keyframes fk2{0%{opacity:0} 44.99%{opacity:0} 45.0%{opacity:1} 65.49%{opacity:1} 65.5%{opacity:0} 100%{opacity:0}}
  #fr3{animation:fk3 11s infinite}
  @keyframes fk3{0%{opacity:0} 65.49%{opacity:0} 65.5%{opacity:1} 100%{opacity:1}}

  </style>
  <rect x="0" y="0" width="760" height="462" rx="14" fill="#0b1c2c"/>
  <rect x="0" y="0" width="760" height="462" rx="14" fill="url(#g)"/>
  <rect x="0.75" y="0.75" width="758.5" height="460.5" rx="13.5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
  <text class="title" x="24" y="34">Merge sort</text>
  <text class="sub" x="24" y="54">Split until sorting is trivial, then merge upwards</text>
  <g id="fr0" class="frm">
    <rect x="272" y="150" width="44" height="34" rx="4" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/><text x="294" y="167" font-size="14" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">38</text>
    <rect x="326" y="150" width="44" height="34" rx="4" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/><text x="348" y="167" font-size="14" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">27</text>
    <rect x="380" y="150" width="44" height="34" rx="4" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/><text x="402" y="167" font-size="14" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">43</text>
    <rect x="434" y="150" width="44" height="34" rx="4" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/><text x="456" y="167" font-size="14" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">9</text>
    <rect x="259" y="220" width="44" height="34" rx="4" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/><text x="281" y="237" font-size="14" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">38</text>
    <rect x="313" y="220" width="44" height="34" rx="4" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/><text x="335" y="237" font-size="14" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">27</text>
    <rect x="393" y="220" width="44" height="34" rx="4" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/><text x="415" y="237" font-size="14" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">43</text>
    <rect x="447" y="220" width="44" height="34" rx="4" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/><text x="469" y="237" font-size="14" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">9</text>
    <text class="step" x="24" y="124">divide: split the array in half</text>
  </g>
  <g id="fr1" class="frm">
    <rect x="272" y="150" width="44" height="34" rx="4" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/><text x="294" y="167" font-size="14" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">38</text>
    <rect x="326" y="150" width="44" height="34" rx="4" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/><text x="348" y="167" font-size="14" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">27</text>
    <rect x="380" y="150" width="44" height="34" rx="4" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/><text x="402" y="167" font-size="14" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">43</text>
    <rect x="434" y="150" width="44" height="34" rx="4" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/><text x="456" y="167" font-size="14" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">9</text>
    <rect x="259" y="220" width="44" height="34" rx="4" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/><text x="281" y="237" font-size="14" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">38</text>
    <rect x="313" y="220" width="44" height="34" rx="4" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/><text x="335" y="237" font-size="14" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">27</text>
    <rect x="393" y="220" width="44" height="34" rx="4" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/><text x="415" y="237" font-size="14" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">43</text>
    <rect x="447" y="220" width="44" height="34" rx="4" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/><text x="469" y="237" font-size="14" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">9</text>
    <rect x="233" y="290" width="44" height="34" rx="4" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/><text x="255" y="307" font-size="14" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">38</text>
    <rect x="313" y="290" width="44" height="34" rx="4" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/><text x="335" y="307" font-size="14" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">27</text>
    <rect x="393" y="290" width="44" height="34" rx="4" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/><text x="415" y="307" font-size="14" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">43</text>
    <rect x="473" y="290" width="44" height="34" rx="4" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/><text x="495" y="307" font-size="14" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">9</text>
    <text class="step" x="24" y="124">keep splitting until every piece holds a single element - a single element is sorted by definition</text>
  </g>
  <g id="fr2" class="frm">
    <rect x="233" y="290" width="44" height="34" rx="4" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/><text x="255" y="307" font-size="14" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">38</text>
    <rect x="313" y="290" width="44" height="34" rx="4" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/><text x="335" y="307" font-size="14" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">27</text>
    <rect x="393" y="290" width="44" height="34" rx="4" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/><text x="415" y="307" font-size="14" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">43</text>
    <rect x="473" y="290" width="44" height="34" rx="4" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/><text x="495" y="307" font-size="14" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">9</text>
    <rect x="259" y="360" width="44" height="34" rx="4" fill="#0f2438" stroke="#34d399" stroke-width="1.8"/><text x="281" y="377" font-size="14" fill="#34d399" text-anchor="middle" dominant-baseline="middle">27</text>
    <rect x="313" y="360" width="44" height="34" rx="4" fill="#0f2438" stroke="#34d399" stroke-width="1.8"/><text x="335" y="377" font-size="14" fill="#34d399" text-anchor="middle" dominant-baseline="middle">38</text>
    <rect x="393" y="360" width="44" height="34" rx="4" fill="#0f2438" stroke="#34d399" stroke-width="1.8"/><text x="415" y="377" font-size="14" fill="#34d399" text-anchor="middle" dominant-baseline="middle">9</text>
    <rect x="447" y="360" width="44" height="34" rx="4" fill="#0f2438" stroke="#34d399" stroke-width="1.8"/><text x="469" y="377" font-size="14" fill="#34d399" text-anchor="middle" dominant-baseline="middle">43</text>
    <text class="step" x="24" y="124">merge pairs back together, always taking the smaller front element first</text>
  </g>
  <g id="fr3" class="frm">
    <rect x="259" y="290" width="44" height="34" rx="4" fill="#0f2438" stroke="#34d399" stroke-width="1.8"/><text x="281" y="307" font-size="14" fill="#34d399" text-anchor="middle" dominant-baseline="middle">27</text>
    <rect x="313" y="290" width="44" height="34" rx="4" fill="#0f2438" stroke="#34d399" stroke-width="1.8"/><text x="335" y="307" font-size="14" fill="#34d399" text-anchor="middle" dominant-baseline="middle">38</text>
    <rect x="393" y="290" width="44" height="34" rx="4" fill="#0f2438" stroke="#34d399" stroke-width="1.8"/><text x="415" y="307" font-size="14" fill="#34d399" text-anchor="middle" dominant-baseline="middle">9</text>
    <rect x="447" y="290" width="44" height="34" rx="4" fill="#0f2438" stroke="#34d399" stroke-width="1.8"/><text x="469" y="307" font-size="14" fill="#34d399" text-anchor="middle" dominant-baseline="middle">43</text>
    <rect x="272" y="360" width="44" height="34" rx="4" fill="#0f2438" stroke="#34d399" stroke-width="1.8"/><text x="294" y="377" font-size="14" fill="#34d399" text-anchor="middle" dominant-baseline="middle">9</text>
    <rect x="326" y="360" width="44" height="34" rx="4" fill="#0f2438" stroke="#34d399" stroke-width="1.8"/><text x="348" y="377" font-size="14" fill="#34d399" text-anchor="middle" dominant-baseline="middle">27</text>
    <rect x="380" y="360" width="44" height="34" rx="4" fill="#0f2438" stroke="#34d399" stroke-width="1.8"/><text x="402" y="377" font-size="14" fill="#34d399" text-anchor="middle" dominant-baseline="middle">38</text>
    <rect x="434" y="360" width="44" height="34" rx="4" fill="#0f2438" stroke="#34d399" stroke-width="1.8"/><text x="456" y="377" font-size="14" fill="#34d399" text-anchor="middle" dominant-baseline="middle">43</text>
    <text class="step" x="24" y="124">merge the two sorted halves into one sorted array. log n levels, O(n) work per level -> O(n log n).</text>
  </g>
  <text class="lbl-l" x="24" y="96">divide and conquer: a problem too big to sort becomes many problems too small to be wrong</text>
  <text class="lbl-l" x="24" y="432" style="fill:#94a3b8">O(n log n) guaranteed in every case and stable, but it needs O(n) extra space for the merge buffer</text>

</svg>
