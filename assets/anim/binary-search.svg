<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" width="620" height="360" role="img" aria-label="Animation: binary search halving the search range at each comparison">
  <title>Animation: binary search halving the search range at each comparison</title>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.09"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
  </defs>
  <style>
  text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;dominant-baseline:middle}
  .title{fill:#e2e8f0;font-size:17px;font-weight:700;dominant-baseline:auto}
  .sub{fill:#94a3b8;font-size:12px;dominant-baseline:auto}
  .lbl{fill:#94a3b8;font-size:11px;text-anchor:middle}
  .lbl-l{fill:#94a3b8;font-size:11px}
  .val{fill:#e2e8f0;font-size:16px;text-anchor:middle;font-weight:600}
  .idx{fill:#64748b;font-size:10px;text-anchor:middle}
  .cell{fill:#0f2438;stroke:#38bdf8;stroke-width:1.5;rx:4}
  .step{fill:#fbbf24;font-size:12px;font-weight:700}
  .edge{stroke:#38bdf8;stroke-width:1.6;fill:none}
  .frm{opacity:0}
  #fr0{animation:fk0 8s infinite}
  @keyframes fk0{0%{opacity:1} 31.32%{opacity:1} 31.333333333333332%{opacity:0} 100%{opacity:0}}
  #fr1{animation:fk1 8s infinite}
  @keyframes fk1{0%{opacity:0} 31.32%{opacity:0} 31.333333333333332%{opacity:1} 58.66%{opacity:1} 58.666666666666664%{opacity:0} 100%{opacity:0}}
  #fr2{animation:fk2 8s infinite}
  @keyframes fk2{0%{opacity:0} 58.66%{opacity:0} 58.666666666666664%{opacity:1} 100%{opacity:1}}

  </style>
  <rect x="0" y="0" width="620" height="360" rx="14" fill="#0b1c2c"/>
  <rect x="0" y="0" width="620" height="360" rx="14" fill="url(#g)"/>
  <rect x="0.75" y="0.75" width="618.5" height="358.5" rx="13.5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
  <text class="title" x="24" y="34">Binary search</text>
  <text class="sub" x="24" y="54">Opening a dictionary in the middle, then halving again</text>
  <g id="fr0" class="frm">
    <g opacity="1"><rect x="60" y="190" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="89.0" y="216.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">3</text></g>
    <text x="89.0" y="258" font-size="10" fill="#64748b" text-anchor="middle">0</text>
    <g opacity="1"><rect x="128" y="190" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="157.0" y="216.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">7</text></g>
    <text x="157.0" y="258" font-size="10" fill="#64748b" text-anchor="middle">1</text>
    <g opacity="1"><rect x="196" y="190" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="225.0" y="216.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">12</text></g>
    <text x="225.0" y="258" font-size="10" fill="#64748b" text-anchor="middle">2</text>
    <g opacity="1"><rect x="264" y="190" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="293.0" y="216.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">18</text></g>
    <text x="293.0" y="258" font-size="10" fill="#64748b" text-anchor="middle">3</text>
    <g opacity="1"><rect x="332" y="190" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="361.0" y="216.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">41</text></g>
    <text x="361.0" y="258" font-size="10" fill="#64748b" text-anchor="middle">4</text>
    <g opacity="1"><rect x="400" y="190" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="429.0" y="216.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">55</text></g>
    <text x="429.0" y="258" font-size="10" fill="#64748b" text-anchor="middle">5</text>
    <g opacity="1"><rect x="468" y="190" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="497.0" y="216.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">90</text></g>
    <text x="497.0" y="258" font-size="10" fill="#64748b" text-anchor="middle">6</text>
    <path d="M89.0 282 L89.0 258" stroke="#94a3b8" stroke-width="2.2" fill="none" marker-end="url(#arg)"/><text x="89.0" y="298" font-size="12" fill="#94a3b8" text-anchor="middle">lo</text>
    <path d="M497.0 282 L497.0 258" stroke="#94a3b8" stroke-width="2.2" fill="none" marker-end="url(#arg)"/><text x="497.0" y="298" font-size="12" fill="#94a3b8" text-anchor="middle">hi</text>
    <text class="step" x="24" y="134">sorted input is the entry fee. Look for 55 in a range of 7.</text>
  </g>
  <g id="fr1" class="frm">
    <g opacity="1"><rect x="60" y="190" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="89.0" y="216.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">3</text></g>
    <text x="89.0" y="258" font-size="10" fill="#64748b" text-anchor="middle">0</text>
    <g opacity="1"><rect x="128" y="190" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="157.0" y="216.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">7</text></g>
    <text x="157.0" y="258" font-size="10" fill="#64748b" text-anchor="middle">1</text>
    <g opacity="1"><rect x="196" y="190" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="225.0" y="216.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">12</text></g>
    <text x="225.0" y="258" font-size="10" fill="#64748b" text-anchor="middle">2</text>
    <g opacity="1"><rect x="264" y="190" width="58" height="52" rx="5" fill="#0f2438" stroke="#fbbf24" stroke-width="2"/><text x="293.0" y="216.0" font-size="16" font-weight="600" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">18</text></g>
    <text x="293.0" y="258" font-size="10" fill="#64748b" text-anchor="middle">3</text>
    <g opacity="1"><rect x="332" y="190" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="361.0" y="216.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">41</text></g>
    <text x="361.0" y="258" font-size="10" fill="#64748b" text-anchor="middle">4</text>
    <g opacity="1"><rect x="400" y="190" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="429.0" y="216.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">55</text></g>
    <text x="429.0" y="258" font-size="10" fill="#64748b" text-anchor="middle">5</text>
    <g opacity="1"><rect x="468" y="190" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="497.0" y="216.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">90</text></g>
    <text x="497.0" y="258" font-size="10" fill="#64748b" text-anchor="middle">6</text>
    <path d="M89.0 282 L89.0 258" stroke="#94a3b8" stroke-width="2.2" fill="none" marker-end="url(#arg)"/><text x="89.0" y="298" font-size="12" fill="#94a3b8" text-anchor="middle">lo</text>
    <path d="M497.0 282 L497.0 258" stroke="#94a3b8" stroke-width="2.2" fill="none" marker-end="url(#arg)"/><text x="497.0" y="298" font-size="12" fill="#94a3b8" text-anchor="middle">hi</text>
    <path d="M293.0 130 L293.0 154" stroke="#fbbf24" stroke-width="2.2" fill="none" marker-end="url(#ara)"/><text x="293.0" y="120" font-size="12" fill="#fbbf24" text-anchor="middle">mid</text>
    <text class="step" x="24" y="134">lo=0 hi=6, mid=3 -> 18 &lt; 55, so everything at or left of 18 is impossible</text>
  </g>
  <g id="fr2" class="frm">
    <g opacity="0.35"><rect x="60" y="190" width="58" height="52" rx="5" fill="#0f2438" stroke="#94a3b8" stroke-width="2"/><text x="89.0" y="216.0" font-size="16" font-weight="600" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">3</text></g>
    <text x="89.0" y="258" font-size="10" fill="#64748b" text-anchor="middle">0</text>
    <g opacity="0.35"><rect x="128" y="190" width="58" height="52" rx="5" fill="#0f2438" stroke="#94a3b8" stroke-width="2"/><text x="157.0" y="216.0" font-size="16" font-weight="600" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">7</text></g>
    <text x="157.0" y="258" font-size="10" fill="#64748b" text-anchor="middle">1</text>
    <g opacity="0.35"><rect x="196" y="190" width="58" height="52" rx="5" fill="#0f2438" stroke="#94a3b8" stroke-width="2"/><text x="225.0" y="216.0" font-size="16" font-weight="600" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">12</text></g>
    <text x="225.0" y="258" font-size="10" fill="#64748b" text-anchor="middle">2</text>
    <g opacity="0.35"><rect x="264" y="190" width="58" height="52" rx="5" fill="#0f2438" stroke="#94a3b8" stroke-width="2"/><text x="293.0" y="216.0" font-size="16" font-weight="600" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">18</text></g>
    <text x="293.0" y="258" font-size="10" fill="#64748b" text-anchor="middle">3</text>
    <g opacity="1"><rect x="332" y="190" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="361.0" y="216.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">41</text></g>
    <text x="361.0" y="258" font-size="10" fill="#64748b" text-anchor="middle">4</text>
    <g opacity="1"><rect x="400" y="190" width="58" height="52" rx="5" fill="#0f2438" stroke="#34d399" stroke-width="2"/><text x="429.0" y="216.0" font-size="16" font-weight="600" fill="#34d399" text-anchor="middle" dominant-baseline="middle">55</text></g>
    <text x="429.0" y="258" font-size="10" fill="#64748b" text-anchor="middle">5</text>
    <g opacity="1"><rect x="468" y="190" width="58" height="52" rx="5" fill="#0f2438" stroke="#38bdf8" stroke-width="2"/><text x="497.0" y="216.0" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">90</text></g>
    <text x="497.0" y="258" font-size="10" fill="#64748b" text-anchor="middle">6</text>
    <path d="M361.0 282 L361.0 258" stroke="#94a3b8" stroke-width="2.2" fill="none" marker-end="url(#arg)"/><text x="361.0" y="298" font-size="12" fill="#94a3b8" text-anchor="middle">lo</text>
    <path d="M497.0 282 L497.0 258" stroke="#94a3b8" stroke-width="2.2" fill="none" marker-end="url(#arg)"/><text x="497.0" y="298" font-size="12" fill="#94a3b8" text-anchor="middle">hi</text>
    <path d="M429.0 130 L429.0 154" stroke="#34d399" stroke-width="2.2" fill="none" marker-end="url(#arg)"/><text x="429.0" y="120" font-size="12" fill="#34d399" text-anchor="middle">mid</text>
    <text class="step" x="24" y="134">lo=4 hi=6, mid=5 -> 55 = 55, found</text>
  </g>
  <text class="lbl-l" x="24" y="96">each guess is the middle, and each wrong guess deletes half of what is left - 1000 items need about 10 comparisons</text>
  <text class="lbl-l" x="24" y="330" style="fill:#94a3b8">O(log n), but only on sorted data. Sorting first costs O(n log n) - worth it only if you will search many times.</text>

</svg>
