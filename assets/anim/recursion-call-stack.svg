<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520" role="img" aria-label="Animation: a recursive factorial call stack growing to the base case and unwinding with return values">
  <title>Animation: a recursive factorial call stack growing to the base case and unwinding with return values</title>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.09"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
  </defs>
  <style>
  text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;dominant-baseline:middle}
  .title{fill:#e2e8f0;font-size:17px;font-weight:700;dominant-baseline:auto}
  .sub{fill:#94a3b8;font-size:12px;dominant-baseline:auto}
  .lbl{fill:#94a3b8;font-size:11px;text-anchor:middle}
  .lbl-l{fill:#94a3b8;font-size:11px}
  .val{fill:#e2e8f0;font-size:16px;text-anchor:middle;font-weight:600}
  .idx{fill:#64748b;font-size:10px;text-anchor:middle}
  .cell{fill:#0f2438;stroke:#38bdf8;stroke-width:1.5;rx:4}
  .step{fill:#fbbf24;font-size:12px;font-weight:700}
  .edge{stroke:#38bdf8;stroke-width:1.6;fill:none}
  .frm{opacity:0}
  #fr0{animation:fk0 11s infinite}
  @keyframes fk0{0%{opacity:1} 24.49%{opacity:1} 24.5%{opacity:0} 100%{opacity:0}}
  #fr1{animation:fk1 11s infinite}
  @keyframes fk1{0%{opacity:0} 24.49%{opacity:0} 24.5%{opacity:1} 44.99%{opacity:1} 45.0%{opacity:0} 100%{opacity:0}}
  #fr2{animation:fk2 11s infinite}
  @keyframes fk2{0%{opacity:0} 44.99%{opacity:0} 45.0%{opacity:1} 65.49%{opacity:1} 65.5%{opacity:0} 100%{opacity:0}}
  #fr3{animation:fk3 11s infinite}
  @keyframes fk3{0%{opacity:0} 65.49%{opacity:0} 65.5%{opacity:1} 100%{opacity:1}}

  </style>
  <rect x="0" y="0" width="700" height="520" rx="14" fill="#0b1c2c"/>
  <rect x="0" y="0" width="700" height="520" rx="14" fill="url(#g)"/>
  <rect x="0.75" y="0.75" width="698.5" height="518.5" rx="13.5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
  <text class="title" x="24" y="34">Recursion - the call stack</text>
  <text class="sub" x="24" y="54">Russian dolls: you cannot close the outer one until the inner one is closed</text>
  <g id="fr0" class="frm">
    <rect x="200" y="176" width="180" height="48" rx="6" fill="#0f2438" stroke="#fbbf24" stroke-width="2.2"/><text x="290" y="200" font-size="15" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">fact(4)</text>
    <text x="184" y="164" font-size="11" fill="#94a3b8" text-anchor="end">call stack</text>
    <path d="M186 168 L186 224" stroke="#94a3b8" stroke-width="1.2" opacity="0.5"/>
    <text class="step" x="24" y="118">fact(4) cannot answer yet - it needs fact(3) first, so it waits and a new frame is pushed</text>
  </g>
  <g id="fr1" class="frm">
    <rect x="200" y="176" width="180" height="48" rx="6" fill="#0f2438" stroke="#38bdf8" stroke-width="2.2"/><text x="290" y="200" font-size="15" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">fact(4)</text>
    <rect x="200" y="238" width="180" height="48" rx="6" fill="#0f2438" stroke="#38bdf8" stroke-width="2.2"/><text x="290" y="262" font-size="15" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">fact(3)</text>
    <rect x="200" y="300" width="180" height="48" rx="6" fill="#0f2438" stroke="#fbbf24" stroke-width="2.2"/><text x="290" y="324" font-size="15" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">fact(2)</text>
    <text x="184" y="164" font-size="11" fill="#94a3b8" text-anchor="end">call stack</text>
    <path d="M186 168 L186 348" stroke="#94a3b8" stroke-width="1.2" opacity="0.5"/>
    <text class="step" x="24" y="118">each call pushes another frame. Nothing has been computed yet - the work is all still pending.</text>
  </g>
  <g id="fr2" class="frm">
    <rect x="200" y="176" width="180" height="48" rx="6" fill="#0f2438" stroke="#38bdf8" stroke-width="2.2"/><text x="290" y="200" font-size="15" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">fact(4)</text>
    <rect x="200" y="238" width="180" height="48" rx="6" fill="#0f2438" stroke="#38bdf8" stroke-width="2.2"/><text x="290" y="262" font-size="15" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">fact(3)</text>
    <rect x="200" y="300" width="180" height="48" rx="6" fill="#0f2438" stroke="#38bdf8" stroke-width="2.2"/><text x="290" y="324" font-size="15" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">fact(2)</text>
    <rect x="200" y="362" width="180" height="48" rx="6" fill="#0f2438" stroke="#fbbf24" stroke-width="2.2"/><text x="290" y="386" font-size="15" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">fact(1)</text>
    <text x="184" y="164" font-size="11" fill="#94a3b8" text-anchor="end">call stack</text>
    <path d="M186 168 L186 410" stroke="#94a3b8" stroke-width="1.2" opacity="0.5"/>
    <text class="step" x="24" y="118">fact(1) is the base case: it returns 1 without calling anything. This is what stops the recursion.</text>
  </g>
  <g id="fr3" class="frm">
    <rect x="200" y="176" width="180" height="48" rx="6" fill="#0f2438" stroke="#34d399" stroke-width="2.2"/><text x="290" y="200" font-size="15" fill="#34d399" text-anchor="middle" dominant-baseline="middle">fact(4)</text>
    <text x="406" y="200" font-size="14" fill="#34d399" dominant-baseline="middle">returns 24</text>
    <path d="M392 200 L396 200" stroke="#34d399" stroke-width="2"/>
    <rect x="200" y="238" width="180" height="48" rx="6" fill="#0f2438" stroke="#34d399" stroke-width="2.2"/><text x="290" y="262" font-size="15" fill="#34d399" text-anchor="middle" dominant-baseline="middle">fact(3)</text>
    <text x="406" y="262" font-size="14" fill="#34d399" dominant-baseline="middle">returns 6</text>
    <path d="M392 262 L396 262" stroke="#34d399" stroke-width="2"/>
    <rect x="200" y="300" width="180" height="48" rx="6" fill="#0f2438" stroke="#34d399" stroke-width="2.2"/><text x="290" y="324" font-size="15" fill="#34d399" text-anchor="middle" dominant-baseline="middle">fact(2)</text>
    <text x="406" y="324" font-size="14" fill="#34d399" dominant-baseline="middle">returns 2</text>
    <path d="M392 324 L396 324" stroke="#34d399" stroke-width="2"/>
    <rect x="200" y="362" width="180" height="48" rx="6" fill="#0f2438" stroke="#34d399" stroke-width="2.2"/><text x="290" y="386" font-size="15" fill="#34d399" text-anchor="middle" dominant-baseline="middle">fact(1)</text>
    <text x="406" y="386" font-size="14" fill="#34d399" dominant-baseline="middle">returns 1</text>
    <path d="M392 386 L396 386" stroke="#34d399" stroke-width="2"/>
    <text x="184" y="164" font-size="11" fill="#94a3b8" text-anchor="end">call stack</text>
    <path d="M186 168 L186 410" stroke="#94a3b8" stroke-width="1.2" opacity="0.5"/>
    <text class="step" x="24" y="118">now the stack unwinds, each frame multiplying the answer it was waiting for: 1, 2, 6, 24</text>
  </g>
  <text class="lbl-l" x="24" y="96">recursion is not magic - it is a stack of paused function calls, each waiting on the one below it</text>
  <text class="lbl-l" x="24" y="462" style="fill:#94a3b8">every recursive function needs a base case that returns without recursing. Missing it means the stack grows until it overflows.</text>
  <text class="lbl-l" x="24" y="488" style="fill:#94a3b8">space cost is O(depth), because every paused frame is real memory</text>

</svg>
