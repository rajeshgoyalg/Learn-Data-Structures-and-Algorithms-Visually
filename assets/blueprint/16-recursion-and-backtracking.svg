<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Recursion - the three required parts">
  <title>Recursion - the three required parts</title>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.09"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
  </defs>
  <style>
  text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;dominant-baseline:middle}
  .title{fill:#e2e8f0;font-size:17px;font-weight:700;dominant-baseline:auto}
  .sub{fill:#94a3b8;font-size:12px;dominant-baseline:auto}
  .lbl{fill:#94a3b8;font-size:11px;text-anchor:middle}
  .lbl-l{fill:#94a3b8;font-size:11px}
  .val{fill:#e2e8f0;font-size:16px;text-anchor:middle;font-weight:600}
  .idx{fill:#64748b;font-size:10px;text-anchor:middle}
  .cell{fill:#0f2438;stroke:#38bdf8;stroke-width:1.5;rx:4}
  .step{fill:#fbbf24;font-size:12px;font-weight:700}
  .edge{stroke:#38bdf8;stroke-width:1.6;fill:none}

  </style>
  <rect x="0" y="0" width="900" height="600" rx="14" fill="#0b1c2c"/>
  <rect x="0" y="0" width="900" height="600" rx="14" fill="url(#g)"/>
  <rect x="0.75" y="0.75" width="898.5" height="598.5" rx="13.5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
  <text class="title" x="24" y="34">Recursion - the three required parts</text>
  <text class="sub" x="24" y="54">Base case, recursive case, and measurable progress</text>
  <text class="lbl-l" x="24" y="96">every correct recursive function has exactly three parts - if one is missing, it either loops forever or returns the wrong answer</text>
  <rect x="50" y="165" width="200" height="62" rx="6" fill="#0f2438" stroke="#34d399" stroke-width="1.8"/>
  <text x="150.0" y="196.0" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle" dominant-baseline="middle">1. BASE CASE</text>
  <text x="270" y="187" font-size="12" fill="#e2e8f0">a size the function answers outright, without recursing</text>
  <text x="270" y="209" font-size="12" fill="#34d399">if n &lt;= 1: return 1</text>
  <rect x="50" y="249" width="200" height="62" rx="6" fill="#0f2438" stroke="#fbbf24" stroke-width="1.8"/>
  <text x="150.0" y="280.0" font-size="13" font-weight="600" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">2. RECURSIVE CASE</text>
  <text x="270" y="271" font-size="12" fill="#e2e8f0">express the answer in terms of a smaller instance</text>
  <text x="270" y="293" font-size="12" fill="#fbbf24">return n * fact(n-1)</text>
  <rect x="50" y="333" width="200" height="62" rx="6" fill="#0f2438" stroke="#c084fc" stroke-width="1.8"/>
  <text x="150.0" y="364.0" font-size="13" font-weight="600" fill="#c084fc" text-anchor="middle" dominant-baseline="middle">3. PROGRESS</text>
  <text x="270" y="355" font-size="12" fill="#e2e8f0">every call must move measurably toward the base case</text>
  <text x="270" y="377" font-size="12" fill="#c084fc">n-1 strictly shrinks n</text>
  <text x="50" y="440" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">BACKTRACKING = RECURSION THAT UNDOES ITSELF</text>
  <path d="M50 448 L870 448" stroke="#38bdf8" stroke-width="1" opacity="0.45"/>
  <text x="50" y="470" font-size="12" fill="#94a3b8">choose a move  -&gt;  recurse  -&gt;  if the branch fails, UNDO the move and try the next one</text>
  <text x="50" y="491" font-size="12" fill="#94a3b8">the undo step is what separates backtracking from plain brute force: dead branches are abandoned early</text>
  <text x="50" y="512" font-size="12" fill="#94a3b8">N queens, sudoku, maze solving, permutations, subset sum - all the same three lines with a different legality test</text>
  <text x="50" y="540" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">THE COSTS NOBODY MENTIONS</text>
  <path d="M50 548 L870 548" stroke="#38bdf8" stroke-width="1" opacity="0.45"/>
  <text x="50" y="570" font-size="12" fill="#94a3b8">space is O(depth), because every paused frame is real memory - deep recursion overflows the stack</text>
  <rect x="578" y="518" width="300" height="62" rx="4" fill="#0a1826" stroke="#38bdf8" stroke-width="1.2" opacity="0.95"/>
  <path d="M578 544 L878 544 M764 544 L764 580" stroke="#38bdf8" stroke-width="1" opacity="0.45"/>
  <text x="590" y="535" font-size="12" font-weight="700" fill="#e2e8f0">VISUAL DSA / BLUEPRINT</text>
  <text x="590" y="564" font-size="10" fill="#94a3b8">SCALE CONCEPTUAL</text>
  <text x="776" y="564" font-size="10" fill="#fbbf24">SHEET 16 / 18</text>

</svg>
