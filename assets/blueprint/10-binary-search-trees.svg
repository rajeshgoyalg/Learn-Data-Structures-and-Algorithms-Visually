<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 666" width="900" height="666" role="img" aria-label="Binary search tree - anatomy">
  <title>Binary search tree - anatomy</title>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.09"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
  </defs>
  <style>
  text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;dominant-baseline:middle}
  .title{fill:#e2e8f0;font-size:17px;font-weight:700;dominant-baseline:auto}
  .sub{fill:#94a3b8;font-size:12px;dominant-baseline:auto}
  .lbl{fill:#94a3b8;font-size:11px;text-anchor:middle}
  .lbl-l{fill:#94a3b8;font-size:11px}
  .val{fill:#e2e8f0;font-size:16px;text-anchor:middle;font-weight:600}
  .idx{fill:#64748b;font-size:10px;text-anchor:middle}
  .cell{fill:#0f2438;stroke:#38bdf8;stroke-width:1.5;rx:4}
  .step{fill:#fbbf24;font-size:12px;font-weight:700}
  .edge{stroke:#38bdf8;stroke-width:1.6;fill:none}

  </style>
  <rect x="0" y="0" width="900" height="666" rx="14" fill="#0b1c2c"/>
  <rect x="0" y="0" width="900" height="666" rx="14" fill="url(#g)"/>
  <rect x="0.75" y="0.75" width="898.5" height="664.5" rx="13.5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
  <text class="title" x="24" y="34">Binary search tree - anatomy</text>
  <text class="sub" x="24" y="54">An ordering invariant that halves the problem at every step</text>
  <text class="lbl-l hdrline" x="24" y="96">the BST invariant is local but its effect is global: it holds at every node, so a whole subtree can be discarded in one comparison</text>
  <g transform="translate(0,0.4)">
  <line x1="261.5" y1="198.7" x2="198.5" y2="245.3" stroke="#38bdf8" stroke-width="1.6" opacity="0.8"/>
  <line x1="298.5" y1="198.7" x2="361.5" y2="245.3" stroke="#38bdf8" stroke-width="1.6" opacity="0.8"/>
  <line x1="167.1" y1="278.1" x2="142.9" y2="313.9" stroke="#38bdf8" stroke-width="1.6" opacity="0.8"/>
  <line x1="192.9" y1="278.1" x2="217.1" y2="313.9" stroke="#38bdf8" stroke-width="1.6" opacity="0.8"/>
  <line x1="367.1" y1="278.1" x2="342.9" y2="313.9" stroke="#38bdf8" stroke-width="1.6" opacity="0.8"/>
  <line x1="392.9" y1="278.1" x2="417.1" y2="313.9" stroke="#38bdf8" stroke-width="1.6" opacity="0.8"/>
  <g><circle cx="280.0" cy="185.0" r="23" fill="#0f2438" stroke="#38bdf8" stroke-width="2.2"/><text x="280.0" y="186.0" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">50</text></g>
  <g><circle cx="180.0" cy="259.0" r="23" fill="#0f2438" stroke="#38bdf8" stroke-width="2.2"/><text x="180.0" y="260.0" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">30</text></g>
  <g><circle cx="380.0" cy="259.0" r="23" fill="#0f2438" stroke="#38bdf8" stroke-width="2.2"/><text x="380.0" y="260.0" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">70</text></g>
  <g><circle cx="130.0" cy="333.0" r="23" fill="#0f2438" stroke="#38bdf8" stroke-width="2.2"/><text x="130.0" y="334.0" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">20</text></g>
  <g><circle cx="230.0" cy="333.0" r="23" fill="#0f2438" stroke="#38bdf8" stroke-width="2.2"/><text x="230.0" y="334.0" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">40</text></g>
  <g><circle cx="330.0" cy="333.0" r="23" fill="#0f2438" stroke="#38bdf8" stroke-width="2.2"/><text x="330.0" y="334.0" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">60</text></g>
  <g><circle cx="430.0" cy="333.0" r="23" fill="#0f2438" stroke="#38bdf8" stroke-width="2.2"/><text x="430.0" y="334.0" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">80</text></g>
  <text x="470" y="180" font-size="12" fill="#94a3b8">left subtree &lt; 50</text>
  <path d="M466 186 L400 208" stroke="#94a3b8" stroke-width="1" opacity="0.5" stroke-dasharray="3 3"/>
  <text x="470" y="206" font-size="12" fill="#94a3b8">right subtree &gt; 50</text>
  <text x="560" y="176" font-size="12" font-weight="700" fill="#38bdf8">TRAVERSAL ORDERS</text>
  <text x="560" y="204" font-size="12" fill="#fbbf24">in-order</text>
  <text x="560" y="220" font-size="11" fill="#e2e8f0">20 30 40 50 60 70 80</text>
  <text x="560" y="234" font-size="10" fill="#94a3b8">sorted output - the reason BSTs matter</text>
  <text x="560" y="250" font-size="12" fill="#fbbf24">pre-order</text>
  <text x="560" y="266" font-size="11" fill="#e2e8f0">50 30 20 40 70 60 80</text>
  <text x="560" y="280" font-size="10" fill="#94a3b8">serialise / copy a tree</text>
  <text x="560" y="296" font-size="12" fill="#fbbf24">post-order</text>
  <text x="560" y="312" font-size="11" fill="#e2e8f0">20 40 30 60 80 70 50</text>
  <text x="560" y="326" font-size="10" fill="#94a3b8">free or evaluate children first</text>
  <text x="560" y="342" font-size="12" fill="#fbbf24">level-order</text>
  <text x="560" y="358" font-size="11" fill="#e2e8f0">50 30 70 20 40 60 80</text>
  <text x="560" y="372" font-size="10" fill="#94a3b8">BFS, uses a queue</text>
  <text x="50" y="420" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">THE CATCH</text>
  <path d="M50 428 L850 428" stroke="#38bdf8" stroke-width="1" opacity="0.45"/>
  <text x="50" y="450" font-size="12" fill="#94a3b8">search / insert / delete are O(log n) ONLY while the tree stays balanced</text>
  <text x="50" y="471" font-size="12" fill="#94a3b8">insert 10, 20, 30, 40 in order and the tree degenerates into a linked list: O(n) for everything</text>
  <text x="50" y="492" font-size="12" fill="#94a3b8">nothing in the plain BST rules prevents this - which is exactly why AVL and red-black trees exist</text>
  <text x="50" y="520" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">DELETING A NODE - THREE CASES</text>
  <path d="M50 528 L850 528" stroke="#38bdf8" stroke-width="1" opacity="0.45"/>
  <text x="50" y="550" font-size="12" fill="#94a3b8">leaf: remove it.   one child: splice the child in.</text>
  <text x="50" y="571" font-size="12" fill="#94a3b8">two children: replace it with its in-order successor (the smallest value in the right subtree)</text>
  </g>
  <rect x="578" y="584" width="300" height="62" rx="4" fill="#0a1826" stroke="#38bdf8" stroke-width="1.2" opacity="0.95"/>
  <path d="M578 610 L878 610 M764 610 L764 646" stroke="#38bdf8" stroke-width="1" opacity="0.45"/>
  <text class="tb" x="590" y="601" font-weight="700" style="fill:#e2e8f0;font-size:12">VISUAL DSA / BLUEPRINT</text>
  <text class="tb" x="590" y="630" style="fill:#94a3b8;font-size:10">SCALE CONCEPTUAL</text>
  <text class="tb" x="776" y="630" style="fill:#fbbf24;font-size:10">SHEET 10 / 18</text>

</svg>
