<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 653" width="900" height="653" role="img" aria-label="Hash table - anatomy">
  <title>Hash table - anatomy</title>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.09"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
  </defs>
  <style>
  text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;dominant-baseline:middle}
  .title{fill:#e2e8f0;font-size:17px;font-weight:700;dominant-baseline:auto}
  .sub{fill:#94a3b8;font-size:12px;dominant-baseline:auto}
  .lbl{fill:#94a3b8;font-size:11px;text-anchor:middle}
  .lbl-l{fill:#94a3b8;font-size:11px}
  .val{fill:#e2e8f0;font-size:16px;text-anchor:middle;font-weight:600}
  .idx{fill:#64748b;font-size:10px;text-anchor:middle}
  .cell{fill:#0f2438;stroke:#38bdf8;stroke-width:1.5;rx:4}
  .step{fill:#fbbf24;font-size:12px;font-weight:700}
  .edge{stroke:#38bdf8;stroke-width:1.6;fill:none}

  </style>
  <rect x="0" y="0" width="900" height="653" rx="14" fill="#0b1c2c"/>
  <rect x="0" y="0" width="900" height="653" rx="14" fill="url(#g)"/>
  <rect x="0.75" y="0.75" width="898.5" height="651.5" rx="13.5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
  <text class="title" x="24" y="34">Hash table - anatomy</text>
  <text class="sub" x="24" y="54">Compute the address instead of searching for it</text>
  <text class="lbl-l hdrline" x="24" y="96">a hash table is three parts bolted together: a hash function, an array of buckets, and a collision policy</text>
  <g transform="translate(0,0.4)">
  <rect x="50" y="170" width="150" height="54" rx="6" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="125.0" y="188.0" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">KEY</text>
  <text x="125.0" y="208.0" font-size="11" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">"alice"</text>
  <path d="M204 197 L246 197" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <rect x="250" y="170" width="170" height="54" rx="6" fill="#0f2438" stroke="#c084fc" stroke-width="1.8"/>
  <text x="335.0" y="188.0" font-size="12" font-weight="600" fill="#c084fc" text-anchor="middle" dominant-baseline="middle">HASH FUNCTION</text>
  <text x="335.0" y="208.0" font-size="11" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">deterministic</text>
  <path d="M424 197 L466 197" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <rect x="470" y="170" width="140" height="54" rx="6" fill="#0f2438" stroke="#fbbf24" stroke-width="1.8"/>
  <text x="540.0" y="188.0" font-size="13" font-weight="600" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">index</text>
  <text x="540.0" y="208.0" font-size="11" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">h % capacity</text>
  <path d="M614 197 L656 197" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <rect x="660" y="170" width="180" height="54" rx="6" fill="#0f2438" stroke="#34d399" stroke-width="1.8"/>
  <text x="750.0" y="188.0" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle" dominant-baseline="middle">BUCKET[3]</text>
  <text x="750.0" y="208.0" font-size="11" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">key + value</text>
  <text x="50" y="262" font-size="12" fill="#94a3b8">the same key must always produce the same index, and good functions scatter similar keys far apart</text>
  <text x="50" y="290" font-size="12" font-weight="700" fill="#38bdf8">LOAD FACTOR = entries / buckets</text>
  <rect x="50" y="300" width="420" height="26" rx="4" fill="#0f2438" stroke="#38bdf8" stroke-width="1.4"/>
  <rect x="52" y="302" width="290" height="22" rx="3" fill="#34d399" opacity="0.45"/>
  <path d="M367 294 L367 332" stroke="#fb7185" stroke-width="2"/>
  <text x="367" y="348" font-size="11" fill="#fb7185" text-anchor="middle">0.75 - resize and rehash here</text>
  <text x="484" y="316" font-size="12" fill="#94a3b8">above this, chains lengthen and O(1) starts to decay</text>
  <text x="50" y="400" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">COLLISION POLICIES</text>
  <path d="M50 408 L850 408" stroke="#38bdf8" stroke-width="1" opacity="0.45"/>
  <text x="50" y="430" font-size="12" fill="#94a3b8">separate chaining  - each bucket holds a list (or a tree); simple, tolerates high load</text>
  <text x="50" y="451" font-size="12" fill="#94a3b8">open addressing    - probe for the next free slot; cache-friendly, but deletion needs tombstones</text>
  <text x="50" y="486" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">COST OF A HASH TABLE</text>
  <path d="M50 494 L850 494" stroke="#38bdf8" stroke-width="1" opacity="0.45"/>
  <text x="50" y="516" font-size="12" fill="#94a3b8">insert / lookup / delete   O(1) average, O(n) worst case when every key collides</text>
  <text x="50" y="537" font-size="12" fill="#94a3b8">no ordering whatsoever - if you need sorted keys or range queries, use a balanced tree instead</text>
  <text x="50" y="558" font-size="12" fill="#94a3b8">a bad or adversarial hash function turns the whole structure into one long linked list</text>
  </g>
  <rect x="578" y="571" width="300" height="62" rx="4" fill="#0a1826" stroke="#38bdf8" stroke-width="1.2" opacity="0.95"/>
  <path d="M578 597 L878 597 M764 597 L764 633" stroke="#38bdf8" stroke-width="1" opacity="0.45"/>
  <text class="tb" x="590" y="588" font-weight="700" style="fill:#e2e8f0;font-size:12">VISUAL DSA / BLUEPRINT</text>
  <text class="tb" x="590" y="617" style="fill:#94a3b8;font-size:10">SCALE CONCEPTUAL</text>
  <text class="tb" x="776" y="617" style="fill:#fbbf24;font-size:10">SHEET 07 / 18</text>

</svg>
