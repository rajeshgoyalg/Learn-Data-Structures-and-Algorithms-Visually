<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 642" width="880" height="642" role="img" aria-label="Array - anatomy">
  <title>Array - anatomy</title>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.09"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
  </defs>
  <style>
  text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;dominant-baseline:middle}
  .title{fill:#e2e8f0;font-size:17px;font-weight:700;dominant-baseline:auto}
  .sub{fill:#94a3b8;font-size:12px;dominant-baseline:auto}
  .lbl{fill:#94a3b8;font-size:11px;text-anchor:middle}
  .lbl-l{fill:#94a3b8;font-size:11px}
  .val{fill:#e2e8f0;font-size:16px;text-anchor:middle;font-weight:600}
  .idx{fill:#64748b;font-size:10px;text-anchor:middle}
  .cell{fill:#0f2438;stroke:#38bdf8;stroke-width:1.5;rx:4}
  .step{fill:#fbbf24;font-size:12px;font-weight:700}
  .edge{stroke:#38bdf8;stroke-width:1.6;fill:none}

  </style>
  <rect x="0" y="0" width="880" height="642" rx="14" fill="#0b1c2c"/>
  <rect x="0" y="0" width="880" height="642" rx="14" fill="url(#g)"/>
  <rect x="0.75" y="0.75" width="878.5" height="640.5" rx="13.5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
  <text class="title" x="24" y="34">Array - anatomy</text>
  <text class="sub" x="24" y="54">One block, fixed stride, computed addresses</text>
  <text class="lbl-l hdrline" x="24" y="96">an array is one unbroken block of memory - that single fact explains every one of its strengths and every one of its costs</text>
  <g transform="translate(0,0.4)">
  <rect x="60" y="190" width="74" height="56" rx="6" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="97.0" y="236" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">10</text>
  <text x="97.0" y="282" font-size="11" fill="#64748b" text-anchor="middle">[0]</text>
  <text x="97.0" y="194" font-size="10" fill="#94a3b8" text-anchor="middle">0x28</text>
  <rect x="142" y="190" width="74" height="56" rx="6" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="179.0" y="236" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">20</text>
  <text x="179.0" y="282" font-size="11" fill="#64748b" text-anchor="middle">[1]</text>
  <text x="179.0" y="194" font-size="10" fill="#94a3b8" text-anchor="middle">0x2C</text>
  <rect x="224" y="190" width="74" height="56" rx="6" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="261.0" y="236" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">30</text>
  <text x="261.0" y="282" font-size="11" fill="#64748b" text-anchor="middle">[2]</text>
  <text x="261.0" y="194" font-size="10" fill="#94a3b8" text-anchor="middle">0x30</text>
  <rect x="306" y="190" width="74" height="56" rx="6" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="343.0" y="236" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">40</text>
  <text x="343.0" y="282" font-size="11" fill="#64748b" text-anchor="middle">[3]</text>
  <text x="343.0" y="194" font-size="10" fill="#94a3b8" text-anchor="middle">0x34</text>
  <rect x="388" y="190" width="74" height="56" rx="6" fill="#0f2438" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="425.0" y="282" font-size="11" fill="#64748b" text-anchor="middle">[4]</text>
  <text x="425.0" y="194" font-size="10" fill="#94a3b8" text-anchor="middle">0x38</text>
  <rect x="470" y="190" width="74" height="56" rx="6" fill="#0f2438" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="507.0" y="282" font-size="11" fill="#64748b" text-anchor="middle">[5]</text>
  <text x="507.0" y="194" font-size="10" fill="#94a3b8" text-anchor="middle">0x3C</text>
  <path d="M60 288 L60 300 M60 294 L380 294 M380 288 L380 300" stroke="#94a3b8" stroke-width="1.2" opacity="0.8"/>
  <text x="220.0" y="318" font-size="11" fill="#94a3b8" text-anchor="middle">length = 4</text>
  <path d="M60 316 L60 328 M60 322 L544 322 M544 316 L544 328" stroke="#94a3b8" stroke-width="1.2" opacity="0.8"/>
  <text x="302.0" y="346" font-size="11" fill="#94a3b8" text-anchor="middle">capacity = 6</text>
  <path d="M261.0 144 L596 144" stroke="#fbbf24" stroke-width="1" opacity="0.6" stroke-dasharray="3 3"/>
  <circle cx="261.0" cy="144" r="10" fill="#0b1c2c" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="261.0" y="163" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">1</text>
  <text x="604" y="144" font-size="12" fill="#e2e8f0" text-anchor="start" dominant-baseline="middle"><tspan x="604" dy="0">consecutive addresses, one fixed</tspan><tspan x="604" dy="18.0">stride</tspan></text>
  <path d="M507.0 268 L596 268" stroke="#94a3b8" stroke-width="1" opacity="0.6" stroke-dasharray="3 3"/>
  <circle cx="507.0" cy="268" r="10" fill="#0b1c2c" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="507.0" y="305" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">2</text>
  <text x="604" y="286" font-size="12" fill="#e2e8f0" text-anchor="start" dominant-baseline="middle"><tspan x="604" dy="0">spare capacity - allocated, not yet</tspan><tspan x="604" dy="18.0">used</tspan></text>
  <text x="60" y="404" font-size="13" fill="#fbbf24">address(i) = base + i x itemSize</text>
  <text x="60" y="424" font-size="11" fill="#94a3b8">one multiply and one add - which is why arr[i] is O(1) no matter how large i is</text>
  <text x="60" y="466" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">CONSEQUENCES OF CONTIGUITY</text>
  <path d="M60 438 L820 438" stroke="#38bdf8" stroke-width="1" opacity="0.45"/>
  <text x="60" y="496" font-size="12" fill="#94a3b8">+ O(1) random access, and CPU cache prefetching makes scans genuinely fast</text>
  <text x="60" y="517" font-size="12" fill="#94a3b8">- insert/delete in the middle is O(n): the block has no gaps, so elements must shift</text>
  <text x="60" y="538" font-size="12" fill="#94a3b8">- growth means allocating a bigger block and copying - amortised O(1) per append</text>
  <rect x="558" y="538" width="300" height="62" rx="4" fill="#0a1826" stroke="#38bdf8" stroke-width="1.2" opacity="0.95"/>
  <path d="M558 564 L858 564 M744 564 L744 600" stroke="#38bdf8" stroke-width="1" opacity="0.45"/>
  <text x="570" y="591" font-size="12" font-weight="700" fill="#e2e8f0">VISUAL DSA / BLUEPRINT</text>
  <text x="570" y="620" font-size="10" fill="#94a3b8">SCALE CONCEPTUAL</text>
  <text x="756" y="620" font-size="10" fill="#fbbf24">SHEET 02 / 18</text>
  </g>

</svg>
