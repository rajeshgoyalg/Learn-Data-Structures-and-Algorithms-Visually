<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" role="img" aria-label="List variants - comparison">
  <title>List variants - comparison</title>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.09"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
  </defs>
  <style>
  text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;dominant-baseline:middle}
  .title{fill:#e2e8f0;font-size:17px;font-weight:700;dominant-baseline:auto}
  .sub{fill:#94a3b8;font-size:12px;dominant-baseline:auto}
  .lbl{fill:#94a3b8;font-size:11px;text-anchor:middle}
  .lbl-l{fill:#94a3b8;font-size:11px}
  .val{fill:#e2e8f0;font-size:16px;text-anchor:middle;font-weight:600}
  .idx{fill:#64748b;font-size:10px;text-anchor:middle}
  .cell{fill:#0f2438;stroke:#38bdf8;stroke-width:1.5;rx:4}
  .step{fill:#fbbf24;font-size:12px;font-weight:700}
  .edge{stroke:#38bdf8;stroke-width:1.6;fill:none}

  </style>
  <rect x="0" y="0" width="880" height="600" rx="14" fill="#0b1c2c"/>
  <rect x="0" y="0" width="880" height="600" rx="14" fill="url(#g)"/>
  <rect x="0.75" y="0.75" width="878.5" height="598.5" rx="13.5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
  <text class="title" x="24" y="34">List variants - comparison</text>
  <text class="sub" x="24" y="54">Same node, different wiring, different guarantees</text>
  <text class="lbl-l" x="24" y="96">three variants, one idea: change what the pointers are allowed to reference and the structure's abilities change with it</text>
  <text x="60" y="159" font-size="12" font-weight="700" fill="#38bdf8">SINGLY</text>
  <rect x="60" y="175" width="150" height="46" rx="6" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="135.0" y="198.0" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">data | next</text>
  <text x="230" y="199" font-size="12" fill="#94a3b8">forward only - cheapest node, O(n) to delete by value</text>
  <text x="60" y="259" font-size="12" font-weight="700" fill="#c084fc">DOUBLY</text>
  <rect x="60" y="275" width="200" height="46" rx="6" fill="#0f2438" stroke="#c084fc" stroke-width="1.8"/>
  <text x="160.0" y="298.0" font-size="13" font-weight="600" fill="#c084fc" text-anchor="middle" dominant-baseline="middle">prev | data | next</text>
  <text x="280" y="299" font-size="12" fill="#94a3b8">walks both ways - O(1) delete given only a node reference</text>
  <text x="60" y="359" font-size="12" font-weight="700" fill="#34d399">CIRCULAR</text>
  <rect x="60" y="375" width="150" height="46" rx="6" fill="#0f2438" stroke="#34d399" stroke-width="1.8"/>
  <text x="135.0" y="398.0" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle" dominant-baseline="middle">data | next</text>
  <path d="M210 398 C 250 398, 250 455, 135 455 C 60 455, 60 431, 60 421" stroke="#34d399" stroke-width="1.8" fill="none" marker-end="url(#arg)"/>
  <text x="280" y="399" font-size="12" fill="#94a3b8">tail points at head - no null, so traversal never terminates on its own</text>
  <text x="60" y="430" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">PICKING BETWEEN THEM</text>
  <path d="M60 438 L820 438" stroke="#38bdf8" stroke-width="1" opacity="0.45"/>
  <text x="60" y="460" font-size="12" fill="#94a3b8">singly     - a stack, a queue, a hash bucket chain: you only ever move forward</text>
  <text x="60" y="481" font-size="12" fill="#94a3b8">doubly     - LRU caches, text editors, browser history: you need to step back</text>
  <text x="60" y="502" font-size="12" fill="#94a3b8">circular   - round-robin scheduling, turn order, buffers that recycle their slots</text>
  <rect x="558" y="518" width="300" height="62" rx="4" fill="#0a1826" stroke="#38bdf8" stroke-width="1.2" opacity="0.95"/>
  <path d="M558 544 L858 544 M744 544 L744 580" stroke="#38bdf8" stroke-width="1" opacity="0.45"/>
  <text x="570" y="535" font-size="12" font-weight="700" fill="#e2e8f0">VISUAL DSA / BLUEPRINT</text>
  <text x="570" y="564" font-size="10" fill="#94a3b8">SCALE CONCEPTUAL</text>
  <text x="756" y="564" font-size="10" fill="#fbbf24">SHEET 04 / 18</text>

</svg>
