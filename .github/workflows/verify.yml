name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # tools/verify.py is stdlib-only on purpose: no pip install, no lockfile,
      # nothing to keep up to date. The repo has no build step and this keeps it
      # that way - the checker only reads files.
      - name: Run repository checks
        run: python3 tools/verify.py
